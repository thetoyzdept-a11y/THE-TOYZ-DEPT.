<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      .brand-title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 900; font-size: 30px; fill: #191919; letter-spacing: -0.5px; }
      .brand-coral { fill: #FF694B; }
      .brand-sub { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 9.5px; fill: #737373; letter-spacing: 2px; }
      .badge-bg { fill: #191919; }
      .badge-text { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 900; font-size: 32px; fill: #D9FF43; }
      .badge-shadow { fill: #D9FF43; }
    </style>
  </defs>

  <!-- Neo-brutalist Badge Shadow -->
  <rect x="18" y="18" width="52" height="52" class="badge-shadow" rx="4" />
  
  <!-- Neo-brutalist Badge -->
  <rect x="14" y="14" width="52" height="52" class="badge-bg" stroke="#191919" stroke-width="3" rx="4" />
  <text x="40" y="51" text-anchor="middle" class="badge-text">T</text>

  <!-- Wordmark Text -->
  <text x="82" y="44" class="brand-title">THE TOYZ DEPT<tspan class="brand-coral">.</tspan></text>
  <text x="83" y="60" class="brand-sub">EST. 2026 // BENGALURU</text>
</svg>
